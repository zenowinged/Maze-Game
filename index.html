<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psychological Maze</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.min.js"></script>
</head>
<body>

    <div id="info-panel">
        <h1>Psychological Maze</h1>
        <p>Use <strong>ARROW KEYS</strong> to move. Reach the <span style="color:#0f0;">GREEN</span> exit. Avoid <span style="color:#f00;">RED</span> traps.</p>
        <p><em>The maze watches how you play. Adapts to your hesitations. Reveals your nature.</em></p>
    </div>
    
    <div id="game-container"></div>

    <script src="script.js"></script>
</body>
</html>
